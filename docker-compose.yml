# Services. `api` and `qdrant` start by default; add a database with a profile:
#   docker compose up -d                      # api + qdrant
#   docker compose --profile demo-db up -d    # + demo PostgreSQL
#   docker compose --profile mysql up -d      # + demo MySQL
#   docker compose --profile mongo up -d      # + demo MongoDB
# Inside the compose network the database host is the service name (demo-postgres, demo-mysql,
# demo-mongo), not localhost: set BUSINESS_DB_URL / DRAFTS_DB_URL in .env accordingly.
# First run:  docker compose up -d && docker compose exec api support-agent ingest
#             then `support-agent seed-demo --url <owner url>` from the host or the container.
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant]
    volumes: ["app_data:/app/data"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  demo-postgres:
    profiles: ["demo-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: shop_owner
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/sql/postgres-init.sql:/docker-entrypoint-initdb.d/10-readonly-role.sql:ro

  demo-mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: shop_owner
      MYSQL_PASSWORD: shop_owner
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/sql/mysql-init.sql:/docker-entrypoint-initdb.d/10-readonly-user.sql:ro

  demo-mongo:
    profiles: ["mongo"]
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

volumes:
  app_data:
  qdrant_data:
  pg_data:
  mysql_data:
  mongo_data:
