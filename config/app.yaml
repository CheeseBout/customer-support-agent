# Application configuration. Environment variables (.env) take precedence for secrets and endpoints;
# everything here is a tunable default. Nothing in code hard-codes these values.

llm:
  temperature: 0.2
  max_output_tokens: 1024
  timeout_seconds: 30
  # Pace model calls to stay under your API tier (e.g. 13 for a 15 requests/minute limit).
  # Env LLM_REQUESTS_PER_MINUTE overrides it. null = no client-side limit.
  requests_per_minute: null
  max_retries: 2
  # Default model per provider. Verify IDs against the provider's docs before production use:
  # free OpenRouter models change often, and Gemini Flash Lite IDs are versioned.
  models:
    openai: gpt-4o-mini
    anthropic: claude-haiku-4-5
    gemini: gemini-3.5-flash-lite
    openrouter: nvidia/nemotron-3-super-120b-a12b:free

embeddings:
  # Used when EMBEDDING_MODEL is empty.
  models:
    local: intfloat/multilingual-e5-large
    openai: text-embedding-3-small
    gemini: models/gemini-embedding-001
  cache_dir: ./data/models

agent:
  max_steps: 12
  run_timeout_seconds: 60
  history_token_limit: 6000
  summarize_after_tokens: 4000
  parallel_subagents: true
  max_tool_calls: 8
  tool_retries: 2
  tool_backoff_seconds: 0.5
  history_messages: 12
  confirmation_ttl_minutes: 15

retrieval:
  collection: policy_chunks
  top_k: 6
  # Cosine similarity gate on the dense vector. e5 models score in a compressed range, so
  # this must be calibrated per embedding model: run `support-agent eval --offline` and read
  # the "Score-threshold calibration" section of the report.
  # Calibrated on the sample corpus (36 answerable / 14 unanswerable questions): 0.80 keeps
  # 100% of answerable questions and rejects 86% of unanswerable ones. The two classes are
  # separated by only ~0.001 (0.813 vs 0.812), so do not tune finer than this. Policy-like
  # questions the documents do not cover score as high as relevant ones; the LLM's
  # `sufficient` flag catches those. A false rejection is costlier than a borderline pass.
  score_threshold: 0.80
  # The gate is per QUERY: the best candidate must reach score_threshold. Passing queries keep
  # the hybrid ranking and drop only hits more than this margin below the threshold, so a
  # relevant keyword match with a slightly lower cosine is not thrown away.
  hit_floor_margin: 0.05
  rerank: false
  hybrid: true
  # SPEC suggests 400-800, but multilingual-e5-large truncates input at 512 tokens, so the
  # dense vector would silently ignore the tail of longer chunks. Raise these only together
  # with an embedding model that has a larger window.
  chunk_tokens: {min: 200, max: 450}
  chunk_overlap_ratio: 0.12
  sparse_model: Qdrant/bm25

router:
  min_confidence: 0.5
  # Order ids and SKUs are extracted with regexes, never with embeddings (FR-007).
  # Built-ins cover "#1234", "order 1234", "đơn hàng 1234" and "ORD-1234". Add your own
  # id formats here (group 1 must capture the id), and override the SKU shape if needed.
  order_id_patterns: []
  sku_pattern: null          # built-in: AAA-X100 style, e.g. PHN-X100, LAP-PRO14

knowledge:
  dir: ./knowledge

mapping:
  path: ./config/schema_mapping.yaml

db:
  max_rows: 50
  query_timeout_seconds: 5

business_rules:
  timezone: Asia/Ho_Chi_Minh
  return:
    window_days: 7
    window_basis: delivered_at        # delivered_at | created_at
    allowed_order_statuses: [delivered]
    excluded_categories: [gift_card]
  refund:
    auto_review_max_amount: 500000
    currency: VND
  warranty:
    default_months: 12
    by_category: {accessories: 6, appliances: 24}
  inventory:
    show_exact_quantity: false
    low_stock_threshold: 5
  order:                              # limits on orders the agent may prepare (SPEC 9.3)
    currency: VND
    max_quantity_per_line: 20
    max_lines: 10
    payment_methods: [cod, bank_transfer, card, momo, zalopay, vnpay]
    cod_max_total: 5000000            # matches knowledge/payment-policy; null = no cap

guardrails:
  max_input_chars: 2000
  rate_limit_per_minute: 20
  injection_detection: true
  pii_masking: true

evals:
  dataset: ./evals/datasets/baseline.jsonl
  report_dir: ./evals/reports
  retrieval_ks: [1, 3, 6]
  concurrency: 1
  thresholds:               # `support-agent eval --fail-under` exits non-zero below these
    routing: 0.92
    trajectory: 0.85
    answer: 0.85
    business: 1.0
    safety: 1.0

memory:
  long_term_enabled: false
  long_term_ttl_days: 180
  session_retention_days: 90
