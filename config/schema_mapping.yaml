# Maps the agent's canonical entities to YOUR database. Docs: docs/schema-mapping.md
#
# This is a starting point, not a working file: the table and column names on the right-hand
# sides are placeholders. Replace them with your own, or let the tool draft the file for you:
#
#     support-agent introspect-db --write config/schema_mapping.yaml
#
# Then check it against the live database:
#
#     support-agent validate-mapping
#
# A right-hand side may be:
#   - a plain column name            sku: product_sku
#   - a constant                     currency: "'USD'"
#   - COALESCE(a, b) / CONCAT(a, b)  name: COALESCE(display_name, title)
# Nothing else is accepted. For joins or computed columns, create a database VIEW and point
# `table` at it. A working example for every supported database is in examples/demo-shop/config/.
dialect: postgres            # postgres | mysql | sqlite | mongodb

entities:
  # --- required: without these there is nothing to look up -------------------------------------
  customer:
    table: customers
    fields: {id: id, email: email, phone: phone, name: full_name}

  order:
    table: orders
    fields:
      id: id                        # what the customer calls "my order number"
      customer_id: customer_id
      status: status
      total: total
      created_at: created_at
      # Optional, delete the ones you do not have:
      currency: "'USD'"
      delivered_at: delivered_at
      shipping_address: shipping_address
      payment_method: payment_method
      subtotal: subtotal
      shipping_fee: shipping_fee
      discount: discount
      tax: tax
      refunded_amount: refunded_amount
    # Your status values -> the ones the agent understands: pending_payment, processing,
    # shipping, partially_shipped, delivered, cancelled, returned, refunded, on_hold.
    # Every value found in the database must be listed (validate-mapping reports the rest).
    status_map:
      "pending": pending_payment
      "paid": processing
      "shipped": shipping
      "delivered": delivered
      "cancelled": cancelled
      "refunded": refunded

  order_item:
    table: order_items
    fields: {order_id: order_id, sku: sku, product_name: name, quantity: quantity, unit_price: price}

  # --- optional: leave an entity out and the tools that need it switch themselves off ----------
  # product + inventory  -> product search, comparison, stock checks, and new orders
  # shipment             -> "where is my order?" with carrier and tracking code
  # return_request       -> blocks a second return request for the same item
  product:
    table: products
    fields:
      sku: sku
      name: name
      description: description
      category: category
      price: price
      attributes: attributes        # a JSON column (or document) of specifications
      active: is_active

  inventory:
    table: inventory
    fields: {sku: sku, quantity: quantity_on_hand}

  shipment:
    table: shipments
    fields:
      order_id: order_id
      carrier: carrier
      tracking_code: tracking_code
      status: status
      updated_at: updated_at
      eta: eta
    status_map:
      "in_transit": in_transit
      "delivered": delivered

  return_request:
    table: return_requests
    fields: {id: id, order_id: order_id, sku: sku, status: status, created_at: created_at}
    status_map:
      "pending": pending
      "approved": approved
      "rejected": rejected
