[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-agent"
version = "0.1.0"
description = "Customer Support Agent backend for SME e-commerce (RAG + MCP data access)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.3",
  "langchain-google-genai>=2.0",
  "qdrant-client[fastembed]>=1.12",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "aiomysql>=0.2",
  "motor>=3.5",
  "mcp>=2.0",
  "tzdata>=2024.1",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyjwt[crypto]>=2.8",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3.0", "psycopg[binary,pool]>=3.2"]
langfuse = ["langfuse>=3.0", "langchain>=1.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "mongomock-motor>=0.0.30",
  "testcontainers[postgres,mysql,mongodb]>=4.8",
]

[project.scripts]
support-agent = "support_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs external services (Postgres, MySQL, MongoDB, Qdrant server)",
  "live_llm: needs a real LLM provider key",
]
addopts = "-m 'not integration and not live_llm'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/support_agent/seed/demo.py" = ["E501"]  # bilingual demo strings
"src/support_agent/core/i18n.py" = ["E501"]  # user-facing message catalog
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
